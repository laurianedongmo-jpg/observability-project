[SERVICE]
    Flush         1
    Log_Level     info
    Parsers_File  parsers.conf

[INPUT]
    Name              tail
    Path              /logs/app.log
    Tag               shop.app
    Parser            json
    Read_from_Head    true
    Refresh_Interval  2

[FILTER]
    Name     grep
    Match    shop.*
    Exclude  level DEBUG

[FILTER]
    Name     modify
    Match    shop.*
    Add      env demo
    Add      collected_by fluent-bit-edge

# OUTPUT: send to the Collector gateway over OTLP/HTTP
[OUTPUT]
    Name        opentelemetry
    Match       *
    Host        otel-gateway
    Port        4318
    Logs_uri    /v1/logs
    Tls         Off
    Tls.verify  Off
