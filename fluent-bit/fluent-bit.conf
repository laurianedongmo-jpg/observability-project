[SERVICE]
    Flush         1
    Log_Level     info
    Parsers_File  parsers.conf

# 1. INPUT: read the application log and tag every record
[INPUT]
    Name              tail
    Path              /logs/app.log
    Tag               shop.app
    Parser            json
    Read_from_Head    true
    Refresh_Interval  2

# 2. FILTER: drop DEBUG records
[FILTER]
    Name     grep
    Match    shop.*
    Exclude  level DEBUG

# 3. FILTER: add two fields to every record
[FILTER]
    Name     modify
    Match    shop.*
    Add      env demo
    Add      collected_by fluent-bit

# 4. OUTPUT: print to the screen (docker compose logs)
[OUTPUT]
    Name     stdout
    Match    *
    Format   json_lines
